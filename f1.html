<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Visualizer</title>
    <link rel="stylesheet" href="style.css" />
    
  </head>
  <body>
    <header>
      <div class="logo">CodeQuest</div>
      <div class="controls">
        <button>History</button>
        <button>Save Screenshot</button>
      </div>
    </header>

    <div class="main">
      <div class="left" id="leftPane">
        <div class="code-viewer" id="codeOutput">
          <code>// Code will be shown here...</code>
        </div>
        <div class="drag-divider" id="dragDivider"></div>
        <div class="animation-box">
          <span class="animation-placeholder">Animation / Graph Visualizer Box</span>
        </div>
      </div>

      <div class="right">
        <div class="slider-group">
          <label for="speed">Speed</label>
          <input
            type="range"
            id="speed"
            min="0.25"
            max="2"
            step="0.25"
            value="1"
          />
        </div>
        <div class="slider-group">
          <label for="zoom">Zoom</label>
          <input
            type="range"
            id="zoom"
            min="0.5"
            max="2"
            step="0.1"
            value="1"
          />
        </div>
        <div class="slider-group">
          <label>Steps</label>
          <div class="step-display" id="stepDisplay">1 / 0</div>
        </div>

        <div>
          <label>Code Examples</label>
          <button class="btn">View</button>
        </div>
        <div class="language-buttons">
          <button onclick="selectLanguage(this, 'js')">JS</button>
          <button onclick="selectLanguage(this, 'py')">Python</button>
          <button onclick="selectLanguage(this, 'c')">C</button>
          <button onclick="selectLanguage(this, 'cpp')">C++</button>
          <button onclick="selectLanguage(this, 'java')">Java</button>
        </div>
        <div>
          <div class="code-editor-box">
            <textarea
              id="codeInput"
              placeholder="Paste your code here..."
            ></textarea>
          </div>
          <button class="btn" onclick="openFullscreenEditor()">
            Full Screen Editor
          </button>
        </div>
        <button class="btn" onclick="submitCode()">OK</button>
      </div>
    </div>

    <div class="fullscreen-editor" id="fullscreenEditor">
      <div class="controls">
        <button onclick="closeFullscreenEditor()">Exit Fullscreen</button>
      </div>
      <textarea id="fullscreenTextarea"></textarea>
    </div>

    <!-- Code Examples Modal -->
    <div class="modal" id="examplesModal" style="display: none">
      <div class="modal-content resizable-modal" id="examplesModalContent">
        <div class="modal-header">
          <span>Code Examples</span>
          <button class="close-btn" onclick="closeExamplesModal()">
            &times;
          </button>
        </div>
        <div class="modal-tabs">
          <button onclick="showExample('js')" id="tab-js" class="active">
            JS
          </button>
          <button onclick="showExample('py')" id="tab-py">Python</button>
          <button onclick="showExample('c')" id="tab-c">C</button>
          <button onclick="showExample('cpp')" id="tab-cpp">C++</button>
          <button onclick="showExample('java')" id="tab-java">Java</button>
        </div>
        <div class="modal-body">
          <div id="example-js" class="examples-list"></div>
          <div
            id="example-py"
            class="examples-list"
            style="display: none"
          ></div>
          <div id="example-c" class="examples-list" style="display: none"></div>
          <div
            id="example-cpp"
            class="examples-list"
            style="display: none"
          ></div>
          <div
            id="example-java"
            class="examples-list"
            style="display: none"
          ></div>
        </div>
        <div class="resize-handle"></div>
      </div>
    </div>

    <footer>
      <button id="repeatBtn">⏮️ Repeat</button>
      <button id="prevBtn">⏪ Prev</button>
      <button id="playBtn">▶️ Play</button>
      <button id="nextBtn">⏩ Next</button>
    </footer>

    <!-- Full Code View Modal -->
    <div class="modal" id="fullCodeModal" style="display: none">
      <div
        class="modal-content resizable-modal fullcode-modal-size"
        id="fullCodeModalContent"
      >
        <div class="modal-header">
          <span>Full Code</span>
          <button class="close-btn" onclick="closeFullCodeModal()">
            &times;
          </button>
        </div>
        <div class="modal-body" style="padding: 24px; display: flex; flex-direction: column; gap: 18px; flex: 1;">
          <pre id="fullCodeContent" class="full-code-scroll"></pre>
          <div style="display: flex; justify-content: flex-end;">
            <button class="btn" onclick="executeFullCode()">Execute</button>
          </div>
        </div>
        <div class="resize-handle"></div>
      </div>
    </div>

    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="animation.js"></script>
  </body>
</html>
